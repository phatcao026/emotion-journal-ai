# ============================================================
# text_only.yaml
# Configuration for the Text-Only processing subsystem
# Covers: Vietnamese text preprocessing, PhoBERT fine-tuning
# ============================================================

text_preprocessor:
  lowercase: false
  remove_punctuation: false
  max_length: 512

text_encoder:
  model_id: "vinai/phobert-base-v2"
  feature_dim: 768
  pooling_strategy: "cls"
  max_length: 256
  freeze: false

classification_head:
  input_dim: 768
  num_primary_classes: 5
  num_sub_classes: 10
  dropout: 0.3

training:
  batch_size: 16
  learning_rate: 2.0e-5
  num_epochs: 40
  warmup_steps: 300
  weight_decay: 0.01
  checkpoint_dir: "checkpoints/text_only/"
  log_dir: "logs/text_only/"
